  - id: d1
    what: Add a standalone public measureThresholds API with explicit observations, caller thresholds, deterministic ordering, precision, Wilson intervals, and AUROC, while leaving floor selection outside the library.
    because: The graph contract asks for an empirical tradeoff surface and explicitly excludes recommending or selecting a threshold.
