<desc id="desc">Dominant 91,5,3,1. Paired 64,25,7,4. Split 51,45,3,1. Clustered 41,34,22,3. Flat 28,26,24,22. Mixed 60,10,10,10,10. All values are percentages; all bars use the same scale.</desc>
