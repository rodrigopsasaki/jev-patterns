name: Release

on:
  push:
    branches: [main]
  # Manual retry path: the version-packages commit already landed but the
  # push-triggered run didn't stage it (e.g. it failed before staging), or a
  # maintainer wants to force a stage without a new commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest

    # Authenticated via npm Trusted Publishing (OIDC). jev-patterns on
    # npmjs.com has a trust relationship pointing at this repo + this
    # workflow file, so the stage step mints a short-lived OIDC token at
    # runtime — no NPM_TOKEN, no long-lived secret. The trust relationship
    # is stage-only: it grants `npm stage publish`, not `npm publish`, so a
    # plain publish from this job is rejected (E403) by design. A human
    # maintainer completes the release with 2FA — see docs/release-policy.md.
    # Provenance attestations are automatic for public-repo + public-package.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Pin npm for staged publishing
        # `npm stage publish` requires npm >= 11.15.0; Node 24's bundled npm
        # (11.5.x as of this pin) predates it. Pinned exact, not a range, so
        # a new npm release can't change stage-publish behavior mid-flight
        # without this workflow being touched. Chosen as the latest 11.x at
        # the time of writing (from `npm view npm versions --json`) rather
        # than the 12.x major, since npm 12 raises its own Node engine floor.
        run: |
          npm install -g npm@11.20.0
          npm -v

      - name: Create Release PR or Publish
        id: changesets
        # changesets/action still owns the version-PR half (accumulating
        # changesets into a "chore: version packages" PR).
        #
        # v2.0.0 renamed the v1 inputs we use: version -> version-script,
        # publish -> publish-script, commit -> commit-message,
        # title -> pr-title. Keeping the old v1 names would not error — v2
        # just ignores unknown `with:` keys — it would silently fall back to
        # `changeset publish` as the default publish step (a no-op here,
        # since we don't call `changeset publish` from npm scripts) and this
        # job would never run `npm run release`, so nothing would ever stage.
        #
        # v2 also defaulted `create-github-releases` and `push-git-tags` to
        # `true`, decoupled from any "New tag: ..." string in the publish
        # step's output. `npm run release` stages via
        # scripts/stage-release.mjs rather than publishing, so a tag or
        # GitHub release here would announce a version before a maintainer
        # has approved the stage with 2FA — see docs/release-policy.md. Both
        # are pinned `false` explicitly rather than relied on to be inferred
        # from the script's behavior.
        #
        # v2 defaults to pushing release commits/tags via the GitHub API
        # instead of the Git CLI (push-with-git-cli: false); the job's
        # existing `contents: write` + `pull-requests: write` permissions
        # already cover that. v2 also stopped reading the GITHUB_TOKEN env
        # var for its own auth (a custom token must go through the
        # `github-token` input) — the action defaults to the
        # GitHub-provided token, which is what this job wants, so that env
        # var is dropped rather than kept as dead config.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
